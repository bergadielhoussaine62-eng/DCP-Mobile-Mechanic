<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCP Mobile Mechanic</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}
header{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}
.hero{
    padding:80px 20px;
    text-align:center;
}
.btn{
    background:#f97316;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:5px;
}
.services{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
}
footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>
<body>

<header>
    <h1>DCP Mobile Mechanic</h1>
</header>

<section class="hero">
    <h2>Mobile Mechanic Services</h2>
    <p>We come to your location and repair your vehicle.</p>
    <a href="tel:+15615555555" class="btn">Call Now</a>
</section>

<section class="services">
    <div class="card">
        <h3>Brake Repair</h3>
        <p>Professional brake services.</p>
    </div>

    <div class="card">
        <h3>Battery Replacement</h3>
        <p>Fast battery replacement.</p>
    </div>

    <div class="card">
        <h3>Oil Change</h3>
        <p>Quick oil change service.</p>
    </div>
</section>

<footer>
© 2026 DCP Mobile Mechanic
</footer>

</body>
</html>
